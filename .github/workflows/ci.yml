name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test, package
    # Xcode 27 toolchain on macOS 27, Apple silicon. The macos-26 image only has Xcode 26.
    runs-on: xcode-27
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode 27
        run: |
          set -euo pipefail
          echo "Installed Xcode versions:"
          ls -d /Applications/Xcode*.app || true
          default_version=$(xcodebuild -version)
          if [[ "$default_version" == "Xcode 27"* ]]; then
            echo "Default Xcode is already 27"
          else
            candidates=$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V || true)
            if [ -z "$candidates" ]; then
              echo "::error::Xcode 27 is not installed on this runner image"
              exit 1
            fi
            stable=$(echo "$candidates" | grep -v -i -E 'beta|rc' | tail -1 || true)
            xcode=${stable:-$(echo "$candidates" | tail -1)}
            sudo xcode-select -s "$xcode/Contents/Developer"
          fi
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build and run unit tests
        run: |
          xcodebuild test -quiet \
            -project Meniscus.xcodeproj \
            -scheme Meniscus \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath build/DerivedData \
            -resultBundlePath build/TestResults.xcresult

      - name: Test summary
        if: ${{ !cancelled() }}
        run: |
          xcrun xcresulttool get test-results summary --path build/TestResults.xcresult --compact \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); print("Tests: {} total, {} passed, {} failed, {} skipped".format(d["totalTestCount"], d["passedTests"], d["failedTests"], d["skippedTests"])); [print("FAILED:", f.get("testName"), f.get("failureText")) for f in d.get("testFailures", [])]'

      - name: Build Release app
        run: |
          xcodebuild build -quiet \
            -project Meniscus.xcodeproj \
            -scheme Meniscus \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build/DerivedData

      - name: Package app
        run: |
          set -euo pipefail
          mkdir -p build/artifact
          ditto -c -k --sequesterRsrc --keepParent \
            build/DerivedData/Build/Products/Release/Meniscus.app \
            build/artifact/Meniscus.zip
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Upload app
        uses: actions/upload-artifact@v5
        with:
          name: Meniscus-${{ env.SHORT_SHA }}
          path: build/artifact/Meniscus.zip
          if-no-files-found: error
          retention-days: 30
