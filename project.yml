name: Meniscus

options:
  bundleIdPrefix: io.github.dtem4ik
  deploymentTarget:
    macOS: "26.0"
  developmentLanguage: en
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    # Strings live in Meniscus/Resources/Localizable.xcstrings (English and Russian).
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    # Builds are ad-hoc signed ("Sign to Run Locally"): no Apple Developer account needed.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO

targets:
  Meniscus:
    type: application
    platform: macOS
    sources:
      - path: Meniscus
      - path: config.example.json
        buildPhase: resources
    info:
      path: Meniscus/Resources/Info.plist
      properties:
        CFBundleDisplayName: Meniscus
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations:
          - en
          - ru
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.utilities
        LSUIElement: true
        NSHumanReadableCopyright: Copyright © 2026 Meniscus contributors. MIT License.
        NSCalendarsFullAccessUsageDescription: Meniscus shows your next calendar event in the notch. Events stay on your Mac.
        NSBluetoothAlwaysUsageDescription: Meniscus shows in the notch when your Bluetooth headphones and speakers connect, with their battery. Nothing leaves your Mac.
        # meniscus://v1/notify links (docs/external-api.md); off until turned on in Settings.
        CFBundleURLTypes:
          - CFBundleURLName: io.github.dtem4ik.meniscus
            CFBundleURLSchemes:
              - meniscus
    settings:
      base:
        PRODUCT_NAME: Meniscus
        PRODUCT_BUNDLE_IDENTIFIER: io.github.dtem4ik.meniscus
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        # The adapter build phase reads the submodule and writes into the app bundle.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    dependencies:
      # The command line tool ships inside the app, in Contents/Helpers.
      - target: meniscus-cli
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
    postBuildScripts:
      - name: Build mediaremote-adapter
        script: '"$SRCROOT/scripts/build-mediaremote-adapter.sh"'
        basedOnDependencyAnalysis: false
    scheme:
      testTargets:
        - MeniscusTests

  meniscus-cli:
    type: tool
    platform: macOS
    sources:
      - path: CLI
    settings:
      base:
        PRODUCT_NAME: meniscus
        # The binary is `meniscus`; its module must not collide with the app's `Meniscus` on a
        # case-insensitive disk.
        PRODUCT_MODULE_NAME: MeniscusCLI
        PRODUCT_BUNDLE_IDENTIFIER: io.github.dtem4ik.meniscus.cli
        SKIP_INSTALL: YES
        # A small single-threaded tool: everything runs on the main thread.
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor

  MeniscusTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: MeniscusTests
    dependencies:
      - target: Meniscus
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.dtem4ik.meniscus.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
